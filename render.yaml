services:
  - type: web
    name: biblioteca-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: prod
      - key: CORS_ORIGINS
        value: "[]"

databases:
  - name: biblioteca-db
    databaseName: biblioteca
    user: biblioteca
    plan: free
    region: oregon
